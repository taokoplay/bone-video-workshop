<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <!-- bone-build 由 regen-manifest.mjs 从 manifest.version 写入：面板据此判断自己是不是旧文档。 -->
    <meta name="bone-build" content="0.21.0" />
    <title>Bone 影视工厂</title>
    <style>
      /* Visual-production design tokens (light and dark), mapped from the
         original prototype palette to the hsl variable names the vp-*
         component styles consume. */
      :root {
        color-scheme: light;
        --background: 0 0% 100%;
        --foreground: 0 0% 14%;
        --card: 0 0% 100%;
        --border: 0 0% 91%;
        --muted: 0 0% 96%;
        --muted-foreground: 0 0% 51%;
        --accent: 0 0% 93%;
        --primary: 0 0% 14%;
        --ring: 137 22% 48%;
        --stage: 90 6% 94%;
        --tab-active: 214 66% 50%;
        --green: 143 26% 38%;
        --green-bg: 125 26% 94%;
        --amber: 43 71% 35%;
        --amber-bg: 45 74% 92%;
        --shadow: 0 12px 32px #0000000c;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        /* 模块底色取自设计稿灰 #222222；卡片/边框在其上逐级提亮，保证层次可辨 */
        --background: 0 0% 13.3%;
        --foreground: 0 0% 93%;
        --card: 0 0% 17%;
        --border: 0 0% 24%;
        --muted: 0 0% 19%;
        --muted-foreground: 0 0% 66%;
        --accent: 0 0% 25%;
        --primary: 0 0% 93%;
        --stage: 0 0% 10%;
        --tab-active: 214 66% 62%;
        --green: 127 24% 74%;
        --green-bg: 147 16% 21%;
        --amber: 43 67% 68%;
        --amber-bg: 43 38% 20%;
        --shadow: 0 12px 32px #0005;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
        padding-top: var(--pi-plugin-titlebar-height, 0px);
        overflow: hidden;
      }
      button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.45; }
      button:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
      h1, h2, h3, h4, p { margin: 0; }
      svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
      [hidden] { display: none !important; }

      /* ---------- shipped vp-* component styles (subset, read-only) ---------- */
      .vp-workspace { height: calc(100dvh - var(--pi-plugin-titlebar-height, 0px)); min-height: 0; display: flex; flex-direction: column; position: relative; background: hsl(var(--background)); overflow: hidden; }
      .vp-top, .vp-tabs { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid hsl(var(--border)); }
      .vp-top { flex-shrink: 0; }
      .vp-top-heading { display: flex; flex: 1; flex-direction: column; gap: 3px; min-width: 0; }
      .vp-brand-row { display: flex; align-items: center; gap: 8px; }
      .vp-top strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .vp-top .vp-brand { color: hsl(var(--muted-foreground)); font-weight: 500; }
      .vp-top .vp-brand em { font-style: normal; color: hsl(var(--foreground)); }
      .vp-tabs { overflow: auto; padding-block: 6px; flex-shrink: 0; gap: 14px; scrollbar-width: none; }
      .vp-tabs::-webkit-scrollbar { display: none; }
      .vp-tabs button { white-space: nowrap; height: 32px; padding-inline: 2px; font-size: 12px; color: hsl(var(--muted-foreground)); }
      .vp-tabs button[aria-current="page"] { border-bottom: 2px solid hsl(var(--primary)); border-radius: 0; color: hsl(var(--foreground)); background: transparent; font-weight: 500; }
      .vp-body { overflow: auto; flex: 1; min-height: 0; padding: 16px; scrollbar-width: thin; }
      .vp-section { display: grid; gap: 14px; }
      .vp-card { padding: 16px; border: 1px solid hsl(var(--border)); border-radius: 12px; background: hsl(var(--card)); }
      .vp-card h3 { font-weight: 600; margin-bottom: 8px; }
      .vp-muted { color: hsl(var(--muted-foreground)); font-size: 12px; }
      .vp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .vp-row > strong { flex: 1; }
       .vp-badge { padding: 3px 7px; border-radius: 5px; background: hsl(var(--muted)); font-size: 11px; }
       .vp-badge.ready { background: hsl(var(--green-bg)); color: hsl(var(--green)); }
       .vp-badge.review { background: hsl(var(--amber-bg)); color: hsl(var(--amber)); }
       .vp-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; margin-top: 10px; }
       .vp-stat { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid hsl(var(--border)); border-radius: 8px; background: hsl(var(--muted) / 0.35); }
       .vp-error { padding: 10px 14px; color: hsl(0 55% 48%); background: hsl(var(--muted)); display: flex; gap: 8px; align-items: center; }
       .vp-info { padding: 8px 14px; background: hsl(var(--green-bg)); color: hsl(var(--green)); font-size: 11px; display: flex; gap: 8px; align-items: center; }
       .vp-info-error { background: hsl(var(--amber-bg)); color: hsl(var(--amber)); }
       .vp-stat strong { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
       .vp-stat span { color: hsl(var(--muted-foreground)); font-size: 10px; }
       .vp-line { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 6px 0; border-bottom: 1px solid hsl(var(--border)); font-size: 12px; text-align: left; }
       .vp-line:last-child { border-bottom: 0; }
       .vp-line-button:hover { background: hsl(var(--accent) / 0.4); }
       .vp-line-index { flex: none; min-width: 22px; font: 11px ui-monospace, monospace; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
       .vp-line-index-quiet { color: hsl(var(--amber)); }
       .vp-line-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
       .vp-code { font: 11px ui-monospace, monospace; padding: 2px 6px; border-radius: 4px; background: hsl(var(--muted)); color: hsl(var(--foreground)); }
       .vp-prompt { margin-top: 10px; padding: 10px 12px; border: 1px solid hsl(var(--border)); border-radius: 8px; background: hsl(var(--muted) / 0.35); color: hsl(var(--muted-foreground)); font: 11px/1.75 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
       .vp-dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; border: 1px solid hsl(var(--border)); border-radius: 12px; background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: var(--shadow); }
       .vp-dialog::backdrop { background: #0005; }
       .vp-dialog form { display: flex; flex-direction: column; min-height: 0; max-height: inherit; }
       .vp-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid hsl(var(--border)); }
       .vp-dialog-head strong { display: block; font-size: 14px; font-weight: 600; }
       .vp-dialog-head small { display: block; margin-top: 4px; color: hsl(var(--muted-foreground)); font-size: 11px; line-height: 1.6; }
       .vp-dialog-body { display: grid; gap: 12px; padding: 16px 18px; overflow: auto; min-height: 0; }
       .vp-field { display: grid; gap: 5px; min-width: 0; }
       .vp-field > span { font-size: 11px; color: hsl(var(--muted-foreground)); }
       .vp-field > span em { font-style: normal; color: hsl(var(--amber)); margin-left: 2px; }
       .vp-dialog-small { width: min(420px, calc(100vw - 32px)); }
       /* 自定义下拉：避免系统原生菜单与深色皮肤冲突 */
       .vp-select { position: relative; }
       .vp-select-trigger { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-width: 0; height: 32px; padding: 7px 9px; border: 1px solid hsl(var(--border)); border-radius: 6px; background: hsl(var(--background)); color: hsl(var(--foreground)); font: inherit; font-size: 12px; text-align: left; }
       .vp-select-trigger:hover { border-color: hsl(var(--muted-foreground) / 0.6); }
       .vp-select-trigger[aria-expanded="true"] { border-color: hsl(var(--ring)); }
       .vp-select-trigger svg { flex: none; color: hsl(var(--muted-foreground)); transition: transform 120ms ease; }
       .vp-select-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }
       .vp-select-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
       .vp-select-menu { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none; border: 1px solid hsl(var(--border)); border-radius: 8px; background: hsl(var(--card)); box-shadow: var(--shadow); max-height: 220px; overflow: auto; }
       .vp-select-menu li { padding: 7px 9px; border-radius: 5px; font-size: 12px; cursor: pointer; }
       .vp-select-menu li:hover { background: hsl(var(--accent)); }
       .vp-select-menu li[aria-selected="true"] { background: hsl(var(--accent)); color: hsl(var(--foreground)); font-weight: 550; }
       .vp-select-menu li[aria-selected="true"]::after { content: "✓"; float: right; color: hsl(var(--green)); }
       .vp-button-danger { border-color: hsl(0 55% 48% / 0.55); background: hsl(0 55% 48%); color: #fff; }
       .vp-button-danger:hover { background: hsl(0 60% 42%); }
       .vp-button-danger:disabled { opacity: 0.5; }
       .vp-field input, .vp-field select, .vp-field textarea { width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid hsl(var(--border)); border-radius: 6px; background: hsl(var(--background)); color: hsl(var(--foreground)); font: inherit; font-size: 12px; }
       .vp-field input, .vp-field select { height: 32px; }
       .vp-field textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
       .vp-field input:focus-visible, .vp-field select:focus-visible, .vp-field textarea:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 1px; }
       .vp-field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
       .vp-dialog-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-top: 1px solid hsl(var(--border)); background: hsl(var(--muted) / 0.25); }
       .vp-dialog-foot .vp-muted { font-size: 10px; }
       .vp-dialog-error { margin: 0; padding: 8px 10px; border-radius: 6px; background: hsl(var(--amber-bg)); color: hsl(var(--amber)); font-size: 11px; }
       @media (max-width: 480px) { .vp-field-pair { grid-template-columns: 1fr; } }
       .vp-card > .vp-button { margin-top: 10px; }
      .vp-media { background: hsl(var(--muted)); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: hsl(var(--muted-foreground)); min-height: 80px; }
      .vp-media img, .vp-media video { width: 100%; height: 100%; object-fit: contain; }
      .vp-button { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 1px solid hsl(var(--border)); border-radius: 6px; background: hsl(var(--card)); font-size: 11px; white-space: nowrap; }
      .vp-button:hover { background: hsl(var(--muted)); }
      .vp-button.primary { border-color: hsl(var(--primary)); background: hsl(var(--primary)); color: hsl(var(--background)); }
      .vp-error { padding: 10px 14px; color: hsl(0 55% 48%); background: hsl(var(--muted)); display: flex; gap: 8px; align-items: center; }
      .vp-empty { padding: 48px 20px; text-align: center; display: grid; justify-items: center; gap: 12px; }
      .vp-empty .vp-media { width: 45px; height: 45px; min-height: 45px; border-radius: 12px; }
      .vp-empty strong { font-size: 13px; font-weight: 600; }
      .vp-empty p { color: hsl(var(--muted-foreground)); font-size: 11px; line-height: 1.8; max-width: 300px; }
      .vp-empty code { font: 11px ui-monospace, monospace; background: hsl(var(--muted)); padding: 1px 5px; border-radius: 4px; }

      /* production directory overlay (original .vp-directory pattern) */
      .vp-directory { position: absolute; inset: calc(var(--pi-plugin-titlebar-height, 0px) + 49px) auto 0 0; width: min(300px, 90%); z-index: 20; background: hsl(var(--background)); border-right: 1px solid hsl(var(--border)); box-shadow: 10px 0 25px #0002; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: auto; scrollbar-width: thin; }
      .vp-directory header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .vp-directory header strong { font-size: 12px; font-weight: 550; }
       .vp-directory-item { display: flex; align-items: center; gap: 4px; width: 100%; min-height: 48px; padding: 4px; border-radius: 8px; }
       .vp-directory-item:hover { background: hsl(var(--muted)); }
       .vp-directory-item.active { background: hsl(var(--accent)); }
       .vp-directory-main { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; padding: 3px 2px; text-align: left; }
       .vp-directory-actions { display: flex; align-items: center; gap: 2px; flex: none; opacity: 0.75; transition: opacity 120ms ease; }
       .vp-directory-item .dir-thumb { width: 40px; height: 26px; flex-shrink: 0; border-radius: 4px; background: hsl(var(--stage)); display: grid; place-items: center; font-size: 12px; }
       .vp-directory-main > span { flex: 1; min-width: 0; }
       .vp-directory-item strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; font-weight: 500; }
       .vp-directory-item small { display: block; margin-top: 2px; color: hsl(var(--muted-foreground)); font-size: 9px; }
       .vp-directory-item:hover .vp-directory-actions, .vp-directory-item:focus-within .vp-directory-actions { opacity: 1; }
       .vp-item-action { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: hsl(var(--muted-foreground)); }
       .vp-item-action:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }
       .vp-item-action.danger:hover { background: hsl(0 55% 48% / 0.16); color: hsl(0 60% 55%); }
      .vp-overlay { position: absolute; inset: calc(var(--pi-plugin-titlebar-height, 0px) + 49px) 0 0; z-index: 19; background: #0002; }

      /* 项目 tab */
       .vp-directory-create { width: 100%; justify-content: center; height: 30px; }
       .vp-directory-empty { margin: 4px 2px 0; color: hsl(var(--muted-foreground)); font-size: 11px; line-height: 1.7; }
      /* 项目 tab：作品简介卡 + 集数卡，字段顺序沿用原版（标题、徽章、简介、声音、核对时间）。 */
      .vp-project-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
       .vp-row-actions { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }
       .vp-row-actions .vp-button { height: 26px; font-size: 11px; }
       .vp-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .vp-project-title h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.2px; line-height: 1.35; overflow-wrap: anywhere; }
      .project-tags { display: flex; gap: 6px; flex-wrap: wrap; }
      .project-tags b { padding: 3px 6px; border-radius: 4px; background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); font-size: 10px; font-weight: 500; white-space: nowrap; }
      .vp-summary { margin-top: 10px; font-size: 12px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
      .vp-project-sound { margin-top: 8px; color: hsl(var(--muted-foreground)); font-size: 11px; }
      .vp-project-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid hsl(var(--border)); color: hsl(var(--muted-foreground)); font-size: 10px; font-variant-numeric: tabular-nums; }
      .vp-project-meta-spacer { flex: 1; min-width: 8px; }
      .vp-project-meta .vp-button { height: 24px; font-size: 10px; padding-inline: 7px; }
      .vp-card-note { margin-top: 10px; line-height: 1.8; }
      .vp-ep-row { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 44px; margin-top: 8px; padding: 7px 9px; border: 1px solid hsl(var(--border)); border-radius: 8px; background: hsl(var(--background)); text-align: left; }
      .vp-ep-row:hover { border-color: hsl(var(--muted-foreground) / 0.55); background: hsl(var(--accent) / 0.35); }
      .vp-ep-index { flex: none; width: 24px; font: 11px ui-monospace, monospace; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
      .vp-ep-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
      .vp-ep-main strong { font-size: 12px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .vp-ep-main small { color: hsl(var(--muted-foreground)); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .vp-ep-count { flex: none; color: hsl(var(--muted-foreground)); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }

      /* 集数行：左标题 / 右剧本（项目页内嵌剧本概览） */
      .vp-ep-block { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 16px; align-items: start; padding: 12px 0; border-top: 1px solid hsl(var(--border)); }
      .vp-ep-block:first-of-type { border-top: 0; padding-top: 4px; }
      .vp-ep-side { display: grid; gap: 5px; justify-items: start; text-align: left; min-width: 0; padding: 2px 0; }
      .vp-ep-side:hover strong { color: hsl(var(--tab-active)); }
      .vp-ep-side-top { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
      .vp-ep-side-top strong { font-size: 12.5px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .vp-ep-side-meta { display: flex; gap: 8px; color: hsl(var(--muted-foreground)); font-size: 10px; font-variant-numeric: tabular-nums; }
      .vp-ep-script { display: grid; gap: 6px; min-width: 0; align-content: start; }
      .vp-ep-logline { font-size: 11.5px; line-height: 1.75; color: hsl(var(--foreground)); overflow-wrap: anywhere; }
      .vp-ep-beatline { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 11px; }
      .vp-ep-beat-purpose { flex: none; padding: 1px 6px; border-radius: 4px; background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); font-size: 9.5px; }
      .vp-ep-beat-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .vp-ep-beat-meta { margin-left: auto; flex: none; color: hsl(var(--muted-foreground)); font-size: 10px; white-space: nowrap; }
      .vp-ep-empty { color: hsl(var(--muted-foreground)); font-size: 10.5px; line-height: 1.7; }
      @media (max-width: 560px) { .vp-ep-block { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
      /* 项目页的集数与剧本：左菜单 + 右侧长文阅读区 */
      .vp-card-flush { padding: 16px 0 8px; }
      .vp-ep-head { padding: 0 16px 10px; }
      .vp-ep-split { display: grid; grid-template-columns: 208px minmax(0, 1fr); align-items: stretch; gap: 14px; padding: 2px 16px 16px; }
      /* 左菜单自成一张圆角卡片，不用分割线区分左右 */
      .vp-ep-menu { display: flex; flex-direction: column; gap: 3px; align-self: stretch; padding: 8px; border: 1px solid hsl(var(--border)); border-radius: 10px; background: hsl(var(--stage)); overflow: auto; scrollbar-width: thin; }
      .vp-ep-menu-item { display: flex; align-items: baseline; gap: 7px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 7px; text-align: left; }
      .vp-ep-menu-item:hover { background: hsl(var(--accent) / 0.55); }
      .vp-ep-menu-item.active { background: hsl(var(--card)); }
      .vp-ep-menu-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
      .vp-ep-menu-top strong { font-size: 11.5px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .vp-ep-menu-meta { display: flex; gap: 8px; padding-left: 23px; color: hsl(var(--muted-foreground)); font-size: 9.5px; font-variant-numeric: tabular-nums; }
      .vp-ep-reader { min-width: 0; padding: 12px 18px 20px; }
      .vp-ep-reader-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid hsl(var(--border)); }
      .vp-ep-reader-copy { min-width: 0; }
      .vp-ep-reader-copy h4 { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
      .vp-ep-reader-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; color: hsl(var(--muted-foreground)); font-size: 10px; font-variant-numeric: tabular-nums; }
      .vp-ep-reader-section { padding: 14px 0; border-bottom: 1px solid hsl(var(--border)); }
      .vp-ep-reader-label { display: block; color: hsl(var(--muted-foreground)); font-size: 10px; }
      .vp-ep-reader-text { margin-top: 6px; max-width: 76ch; font-size: 12px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
      .vp-ep-reader-lead { font-size: 13px; line-height: 1.85; }
      .vp-ep-beat-block { padding: 16px 0; border-bottom: 1px solid hsl(var(--border)); }
      .vp-ep-beat-block:last-child { border-bottom: 0; }
      .vp-ep-beat-head { display: flex; align-items: center; gap: 8px; }
      .vp-ep-beat-index { font: 10px ui-monospace, monospace; color: hsl(var(--muted-foreground)); }
      .vp-ep-beat-shots { margin-left: auto; color: hsl(var(--muted-foreground)); font-size: 10px; white-space: nowrap; }
      .vp-ep-beat-block h5 { margin: 7px 0 0; font-size: 14px; font-weight: 550; line-height: 1.5; overflow-wrap: anywhere; }

      .vp-script-arc-toggle { flex: none; color: hsl(var(--muted-foreground)); font-size: 10px; }

      .vp-script-beat-detail { min-width: 0; padding-top: 20px; }
