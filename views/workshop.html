             <label class="vp-field">
               <span>配音</span>
               <input name="voice" maxlength="2000" placeholder="例如：女声，温柔" autocomplete="off" />
             </label>
             <label class="vp-field">
               <span>音乐</span>
               <input name="music" maxlength="2000" placeholder="例如：氛围电子" autocomplete="off" />
             </label>
           </div>
           <p class="vp-dialog-error" id="createError" hidden></p>
         </div>
         <footer class="vp-dialog-foot">
           <span class="vp-muted">标题必填；其余可创建后继续修改。</span>
           <button type="submit" class="vp-button primary" id="createSubmit">创建作品</button>
         </footer>
       </form>
     </dialog>
     <!-- 删除确认：永久删除不可撤销，所以单独弹窗并写明后果 -->
     <dialog id="confirmDialog" class="vp-dialog vp-dialog-small">
       <div class="vp-dialog-head">
         <div>
           <strong id="confirmTitle">删除作品</strong>
           <small id="confirmHint"></small>
         </div>
       </div>
       <div class="vp-dialog-body">
         <p class="vp-muted" id="confirmDetail"></p>
       </div>
       <div class="vp-dialog-foot">
         <span class="vp-muted">删除后无法恢复。</span>
         <div class="vp-row-actions">
           <button type="button" class="vp-button" id="confirmCancel">取消</button>
           <button type="button" class="vp-button vp-button-danger" id="confirmOk">永久删除</button>
         </div>
       </div>
     </dialog>
    <script src="./media-preview.js"></script>
    <script src="./sequence-preview.js"></script>
    <script src="./editorial.js"></script>
    <script src="./revisions.js"></script>
    <script src="./storyboard.js"></script>
    <script src="./project-bible.js"></script>
    <script src="./asset-details.js"></script>
    <script>
      "use strict";
      const bridge = window.pluginBridge;
      const bodyEl = document.getElementById("body");
      const tabsEl = document.getElementById("tabs");
      const topTitle = document.getElementById("topTitle");
      const topCounts = document.getElementById("topCounts");
      const refreshBtn = document.getElementById("refresh");
      const refreshEmpty = document.getElementById("refreshEmpty");
      const dirToggle = document.getElementById("dirToggle");

      // Follow the host appearance.
      const themeQuery = window.matchMedia("(prefers-color-scheme: dark)");
      function applyTheme() {
        document.documentElement.dataset.theme = themeQuery.matches ? "dark" : "light";
      }
      themeQuery.addEventListener("change", applyTheme);
      applyTheme();

      const KIND_LABELS = { comic: "漫剧", film: "影片", promo: "宣传片", image: "图片" };
      const JOB_STATUS_LABELS = { running: "运行中", candidate: "待审", failed: "失败", cancelled: "已取消", interrupted: "已中断" };
      const TABS = [
        ["project", "项目"],   // 作品简介 + 资产
        ["script", "剧本"],    // 每集剧本正文
        ["breakdown", "脚本"], // 叙事节拍拆解
        ["shots", "分镜"],
        ["configuration", "制作配置"],
      ];
      const SCRIPT_FIELDS = [
        ["logline", "一句话故事"],
        ["audiencePromise", "观众承诺"],
        ["hook", "开场钩子"],
        ["turningPoint", "核心转折"],
        ["payoff", "阶段结果"],
        ["productionNotes", "制作总要求"],
      ];

      let summaries = [];   // production summaries from bone.list
      let currentId = null; // active production id
      let current = null;   // { snapshot } from bone.get
      let tab = "project";
      let selectedShotId = null;
      let scriptEpisodeId = null; // 剧本页与脚本页共用的当前集（两页菜单联动）
      const ASSET_TYPES = ["角色", "场景", "产品", "道具", "风格", "品牌", "声音"];
      let assetTypeFilter = "全部";
      let assetSearch = "";
      let scriptBeatIndex = 0; // 脚本页左侧选中的叙事要素
      let directoryOpen = false;

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }
      function fmtTime(ms) {
        return ms ? new Date(ms).toLocaleString() : "";
      }
       // 面板只读展示：日期给到天，修改时间用相对说法更省空间。
       function fmtDate(ms) {
         if (!ms) return "—";
         const d = new Date(ms);
         const pad = (n) => String(n).padStart(2, "0");
         return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
       }
       function fmtRelative(ms) {
         if (!ms) return "—";
         const diff = Date.now() - ms;
         if (diff < 60e3) return "刚刚";
         if (diff < 3600e3) return `${Math.floor(diff / 60e3)} 分钟前`;
         if (diff < 86400e3) return `${Math.floor(diff / 3600e3)} 小时前`;
         if (diff < 7 * 86400e3) return `${Math.floor(diff / 86400e3)} 天前`;
         return fmtDate(ms);
       }
      function setStatus(text) {
        let bar = document.getElementById("vpStatus");
        if (!text) { bar?.remove(); return; }
        if (!bar) { bar = el("div", "vp-error"); bar.id = "vpStatus"; bodyEl.before(bar); }
        bar.replaceChildren(el("span", null, text));
      }
       // 时长按中文习惯输出：不足一分钟给秒，超过给分秒。
       function fmtDuration(totalSeconds) {
         const seconds = Math.max(0, Math.round((Number(totalSeconds) || 0) * 1000) / 1000);
         if (seconds < 60) return `${seconds} 秒`;
         const minutes = Math.floor(seconds / 60);
         const rest = Math.round((seconds % 60) * 1000) / 1000;
         return rest ? `${minutes} 分 ${rest} 秒` : `${minutes} 分`;
       }

       // 复制走宿主的剪贴板通道（clipboard.write）；失败时退回到可手选的提示。
       async function copyText(text, okMessage) {
         try {
           await bridge.invoke("clipboard.writeText", { text });
           flash(okMessage || "已复制");
         } catch (error) {
           flash(`复制失败：${String(error && error.message || error)}`, true);
         }
       }

       let flashTimer = null;
       function flash(text, isError) {
         let bar = document.getElementById("vpFlash");
         if (!bar) { bar = el("div", "vp-info"); bar.id = "vpFlash"; bodyEl.before(bar); }
         bar.classList.toggle("vp-info-error", Boolean(isError));
         bar.replaceChildren(el("span", null, text));
         clearTimeout(flashTimer);
         flashTimer = setTimeout(() => document.getElementById("vpFlash")?.remove(), 2200);
       }

       // 给 Agent 的续写指令：只描述现状与缺口，不替 Agent 编内容。
       function buildAgentPrompt(doc, shots, stale) {
         const lines = [
           `继续完善 Bone 影视工厂里的作品 ${doc.id}《${doc.title}》（${KIND_LABELS[doc.kind] || doc.kind}）。`,
         ];
         const episodes = Array.isArray(doc.episodes) ? doc.episodes : [];
         const assets = Array.isArray(doc.assets) ? doc.assets : [];
         if (!episodes.length) lines.push("• 还没有剧集：先写第一集完整可拍摄正文，再拆脚本节拍。");
         else {
           const missing = episodes.filter((ep) => !ep.script?.prose?.trim());
           if (missing.length) lines.push(`• 这些集缺少剧本正文：${missing.map((ep) => ep.title || ep.id).join("、")}`);
         }
         if (!assets.length) lines.push("• 还没有资产：先登记主要角色与场景，再让镜头引用它们。");
         if (!shots.length) lines.push("• 还没有分镜：按剧本拆镜头，每镜写清画面、运动和对白。");
         if (stale.length) {
           lines.push(`• 有 ${stale.length} 个镜头设定已改动、画面需要重做：${stale.slice(0, 5).map((s) => s.title || s.id).join("、")}`);
         }
         const unused = assets.filter((asset) => !shots.some((shot) => (shot.assetIds || []).includes(asset.id)));
         if (unused.length) lines.push(`• 这些资产还没被任何镜头引用：${unused.map((a) => a.name || a.id).join("、")}`);
         if (lines.length === 1) lines.push("• 已有创作记录，请按实际正文与素材核查准备程度，不能据字段存在宣称审核通过。");
         lines.push("先用 get_production 和 get_workflow_status 读取现状与缺口。duration 是成片预算，productionPlan 另存生成长度和留量；保留小数。实际素材生成后 register_media、记录 record_media_inspection，再按需采用或 save_edit_plan 选段。用 record_review 区分文本、技术、画面、声音和连续性证据；没有观看或听验时标未验证，不把预览称为最终导出。");
         return lines.join("\n");
       }

      function summaryOf(id) { return summaries.find((item) => item.id === id) || null; }
      function snapshotDoc() { return current?.snapshot.document || null; }
      function shotsOf(doc) { return Array.isArray(doc?.shots) ? doc.shots : []; }
      function shotState(snapshot, shotId) { return snapshot.shotStates?.[shotId] || null; }
      function adoptedImageId(shot) {
        return (shot.outputs && shot.outputs.image) || shot.mediaId || null;
      }
      // 插件已被宿主重载、这一页还是旧文档时，自愈刷新一次（同一版本只试一次）。
      function selfHealToVersion(version, build) {
        if (!version || !build || version === build) return false;
        try {
          const key = "bonePageReload:" + version;
          if (sessionStorage.getItem(key)) return false;
          sessionStorage.setItem(key, "1");
        } catch {
          return false; // sessionStorage 不可用时不冒险循环刷新。
        }
        location.reload();
        return true;
      }


      // 上报这一页自己的文档状态：宿主侧据此判断面板是不是旧页面。
      function reportPage() {
        const docBuild = document.querySelector('meta[name="bone-build"]')?.content || "";
        const shownVersion = (document.getElementById("topVersion")?.textContent || "").replace(/^v/, "");
        try {
          const sent = bridge.invoke("bone.probe", {
            build: docBuild,
            pluginVersion: shownVersion,
            tabs: [...document.querySelectorAll("#tabs button")].map((b) => b.textContent.trim()),
            title: document.title,
            href: location.href,
          });
          if (sent && typeof sent.catch === "function") sent.catch(() => {});
        } catch {
          // 上报失败不影响页面本身。
        }
      }

      // ---------- 启动自检（能力横幅） ----------
      async function refreshCapabilities() {
        const versionEl = document.getElementById("topVersion");
        const existing = document.getElementById("vpBanner");

        let status = null;
        try {
          status = await bridge.invoke("bone.status");
        } catch {
          existing?.remove(); // 宿主不支持该通道时静默隐藏
          return;
        }
        const version = status?.version ? String(status.version) : "";
        if (versionEl && version) {
          versionEl.hidden = false;
          versionEl.textContent = "v" + version;
          versionEl.title = "当前运行的插件版本";
        }
        // 插件已被宿主重载，但这一页还是旧文档时，自愈刷新一次；再不行就明说。
        const build = document.querySelector('meta[name="bone-build"]')?.content || "";
        reportPage();
        if (selfHealToVersion(version, build) || (build && version && build !== version)) {
          if (versionEl) {
            versionEl.title = "面板文档是 v" + build + "，插件是 v" + version + "：关闭这个面板再重新打开即可";
          }
          bodyEl.before(
            (() => {
              const stale = el("div", "vp-banner");
              stale.id = "vpStale";
              const copy = el("div");
              copy.appendChild(el("strong", null, "面板是旧页面"));
              copy.appendChild(
                el("p", null, "插件已更新到 v" + version + "，这一页仍在显示 v" + build + " 的文档：关闭面板后重新打开即可。"),
              );
              const again = el("button", "vp-button", "立即刷新");
              again.addEventListener("click", () => location.reload());
              copy.appendChild(again);
              stale.appendChild(copy);
              return stale;
            })(),
          );
        }
        existing?.remove();
        if (!status || (status.agentAvailable && !(status.errors || []).length)) return;
        const banner = el("div", "vp-banner");
        banner.id = "vpBanner";
        const copy = el("div");
        const title = status.agentAvailable ? "部分工具未注册" : "Agent 工具尚未注册";
        copy.appendChild(el("strong", null, title));
        const hint = el("p", null, "当前插件版本 ");
        hint.appendChild(el("code", null, status.version || "unknown"));
        hint.append("：请在 Plugins 页对「Bone 影视工厂」执行 More → Reload，并同意新增权限（agent.tool.register）。在此之前，对话里的 Agent 调不到创建/写入工具。");
        copy.appendChild(hint);
        const errors = (status.errors || []).slice(0, 2);
        for (const item of errors) copy.appendChild(el("p", null, item));
        const retry = el("button", "vp-button", "重新检测");
        retry.addEventListener("click", () => refreshCapabilities());
        copy.appendChild(retry);
        banner.appendChild(copy);
        bodyEl.before(banner);
      }

      // ---------- data loading (plugin-owned storage over bridge channels) ----------

      async function loadList() {
        refreshBtn.disabled = true;
        setStatus("");
        try {
          const result = await bridge.invoke("bone.list");
          summaries = result.productions || [];
          if (!summaries.some((item) => item.id === currentId)) {
            currentId = summaries[0]?.id ?? null;
            current = null;
            selectedShotId = null;
          }
          await ensureCurrent(true);
          render();
          reportPage();
        } catch (error) {
          setStatus(`读取失败：${String(error && error.message || error)}`);
        } finally {
          refreshBtn.disabled = false;
        }
      }

      let productionLoadSequence = 0;
      async function ensureCurrent(force = false) {
        const sequence = ++productionLoadSequence;
        const requestedId = currentId;
        if (!requestedId) { current = null; return; }
        if (!force && current?.snapshot?.document?.id === requestedId) return;
        try {
          const result = await bridge.invoke("bone.get", { id: requestedId });
          if (sequence !== productionLoadSequence || requestedId !== currentId) return;
          current = { snapshot: result.snapshot, workflow: result.workflow };
        } catch (error) {
          if (sequence !== productionLoadSequence || requestedId !== currentId) return;
          current = null;
          setStatus(`作品 ${requestedId} 读取失败：${String(error && error.message || error)}`);
        }
      }

      async function selectProduction(id) {
        window.BoneMediaPreview.beginRender();
        window.BoneAssetDetails.beginRender();
        window.BoneSequencePreview.beginRender();
        currentId = id;
        selectedShotId = null;
        directoryOpen = false;
        await ensureCurrent();
        render();
      }

      // ---------- rendering ----------

      function render() {
        window.BoneMediaPreview.beginRender();
        window.BoneAssetDetails.beginRender();
        window.BoneSequencePreview.beginRender();
        const hasList = summaries.length > 0;
        // Reading and storyboard views fill the panel with independently scrolling columns.
        bodyEl.classList.toggle("vp-body-fill", Boolean(snapshotDoc()) && ["script", "breakdown", "shots"].includes(tab));
        dirToggle.disabled = !hasList;
        refreshBtn.disabled = false;
        const doc = snapshotDoc();
        const summary = summaryOf(currentId);
        topTitle.textContent = doc ? (doc.title || doc.id) : hasList ? "选择一个作品" : "尚未创建作品";
        dirToggle.disabled = false; // 目录里也能新建，所以始终可打开
        if (doc) {
          topCounts.textContent = `${KIND_LABELS[doc.kind] || doc.kind} · 镜头 ${shotsOf(doc).length} · 资产 ${(doc.assets || []).length}`;
        } else {
          topCounts.hidden = true;
        }
        renderDirectory();
        if (!doc) {
          tabsEl.hidden = true;
          renderNoProduction(summary);
          return;
        }
         tabsEl.hidden = false;
         renderTabs(doc);
        if (tab === "project") renderProjectTab(current);
        else if (tab === "script") renderScriptTab(current);
        else if (tab === "breakdown") renderBreakdownTab(current);
        else if (tab === "shots") renderShotsTab(current);
        else renderConfigurationTab(current);
      }

      function renderTabs(doc) {
        tabsEl.replaceChildren();
        for (const [key, label] of TABS) {
          const button = el("button", null, key === "shots" && doc.kind === "image" ? "图片" : label);
          if (tab === key) button.setAttribute("aria-current", "page");
          button.addEventListener("click", () => { tab = key; selectedShotId = null; render(); });
          tabsEl.appendChild(button);
        }
      }

      function renderNoProduction(summary) {
        const empty = el("div", "vp-empty");
        if (summary?.broken) {
          empty.appendChild(el("div", "vp-media", "⚠️"));
          empty.appendChild(el("strong", null, "当前作品数据无法读取"));
          empty.appendChild(el("p", null, `作品 ${summary.id} 的数据损坏或格式不受支持。`));
        } else if (summaries.length) {
          empty.appendChild(el("div", "vp-media", "🎬"));
          empty.appendChild(el("strong", null, "选择一个作品"));
          empty.appendChild(el("p", null, "从左上角的作品目录中选择要查看的影像作品。"));
          const open = el("button", "vp-button primary", "打开作品目录");
          open.addEventListener("click", () => { directoryOpen = true; render(); });
          empty.appendChild(open);
        } else {
          empty.appendChild(el("div", "vp-media", "🎬"));
          empty.appendChild(el("strong", null, "还没有作品"));
          empty.appendChild(el("p", null, "在对话里让 Agent 创建第一个影像作品，例如：「帮我创建一个漫剧作品《星尘旅人》」，然后回这里刷新浏览。"));
          const refresh = el("button", "vp-button primary", "刷新");
          refresh.addEventListener("click", () => loadList());
          empty.appendChild(refresh);
        }
        bodyEl.replaceChildren(empty);
      }

      function renderDirectory() {
        document.getElementById("vpDirectory")?.remove();
        document.getElementById("vpOverlay")?.remove();
        if (!directoryOpen) return;
        const overlay = el("div");
        overlay.id = "vpOverlay";
        overlay.className = "vp-overlay";
        overlay.addEventListener("click", () => { directoryOpen = false; render(); });
        const dir = el("div");
        dir.id = "vpDirectory";
        dir.className = "vp-directory";
        const head = el("header");
        head.appendChild(el("strong", null, summaries.length ? `作品目录（${summaries.length}）` : "作品目录"));
        const close = el("button", "vp-button", "关闭");
        close.addEventListener("click", () => { directoryOpen = false; render(); });
        head.appendChild(close);
        dir.appendChild(head);

        // 新建入口放在目录里：目录同时是"选作品"和"加作品"的地方。
        const createButton = el("button", "vp-button primary vp-directory-create", "＋ 新建作品");
        createButton.addEventListener("click", () => {
          directoryOpen = false;
          render();
          openCreateDialog();
        });
        dir.appendChild(createButton);

        if (!summaries.length) {
          dir.appendChild(el("p", "vp-directory-empty",
            "还没有作品。点上面的「新建作品」创建第一个，或让 Agent 在对话里创建。"));
        }
        for (const summary of summaries) {
          const row = el("div", "vp-directory-item" + (summary.id === currentId ? " active" : ""));
          const main = el("button", "vp-directory-main");
          main.appendChild(el("div", "dir-thumb", summary.kind ? "🎞️" : "⚠️"));
          const text = el("span");
          text.appendChild(el("strong", null, summary.title || summary.id));
          text.appendChild(el("small", null, summary.broken
            ? "数据无法读取"
            : `${KIND_LABELS[summary.kind] || summary.kind || "未知"} · 镜头 ${summary.shotCount}`));
          main.appendChild(text);
          if (summary.broken) {
            main.disabled = true;
          } else {
            main.addEventListener("click", () => selectProduction(summary.id));
          }
          row.appendChild(main);

          // 行内操作：编辑设定 / 删除。hover 才完全显现，避免目录显脏。
          const actions = el("div", "vp-directory-actions");
          if (!summary.broken) {
            const editBtn = el("button", "vp-item-action", "✎");
            editBtn.title = "编辑设定";
            editBtn.setAttribute("aria-label", `编辑 ${summary.title || summary.id}`);
            editBtn.addEventListener("click", async (event) => {
              event.stopPropagation();
              await selectProduction(summary.id);
              if (current?.snapshot?.document?.id === summary.id) {
                openEditDialog(current.snapshot.document);
              }
            });
            actions.appendChild(editBtn);
          }
          const delBtn = el("button", "vp-item-action danger", "🗑");
          delBtn.title = "删除作品";
          delBtn.setAttribute("aria-label", `删除 ${summary.title || summary.id}`);
          delBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            askDeleteProduction(summary);
          });
          actions.appendChild(delBtn);
          row.appendChild(actions);
          dir.appendChild(row);
        }
        bodyEl.before(overlay, dir);
      }

      // 项目页：作品设定 + 资产（剧本与脚本各自成页）
      function renderProjectTab(prod) {
        const doc = prod.snapshot.document;
        const shots = shotsOf(doc);
        const episodes = Array.isArray(doc.episodes) ? doc.episodes : [];
        const stale = shots.filter((shot) => shotState(prod.snapshot, shot.id)?.needsUpdate);
        const section = el("div", "vp-section");

        const intro = el("div", "vp-card");
        const introHead = el("div", "vp-card-head");
        introHead.appendChild(el("h3", null, "作品简介"));
        const headActions = el("div", "vp-row-actions");
        const editButton = el("button", "vp-button", "编辑设定");
        editButton.addEventListener("click", () => openEditDialog(doc));
        headActions.appendChild(editButton);
        const refButton = el("button", "vp-button", "引用到 Agent");
        refButton.addEventListener("click", () => copyText(buildAgentPrompt(doc, shots, stale), "指令已复制，去对话里粘贴"));
        headActions.appendChild(refButton);
        introHead.appendChild(headActions);
        intro.appendChild(introHead);

        const titleRow = el("div", "vp-project-title");
        titleRow.appendChild(el("h2", null, doc.title || "未命名作品"));
        const badges = el("div", "project-tags");
        badges.appendChild(el("b", null, KIND_LABELS[doc.kind] || doc.kind || "影像作品"));
        if (doc.ratio) badges.appendChild(el("b", null, doc.ratio));
        if (doc.kind !== "image" && doc.fps) badges.appendChild(el("b", null, `${doc.fps} fps`));
        if (doc.style) badges.appendChild(el("b", null, `风格 ${doc.style}`));
        titleRow.appendChild(badges);
        intro.appendChild(titleRow);

        intro.appendChild(el("p", "vp-summary",
          doc.brief || "尚未填写简介，可在面板新建时填写，或让 Agent 读取作品后补全。"));
        intro.appendChild(el("p", "vp-project-sound",
          `声音：${doc.voice || "未设置"} · 配乐：${doc.music || "未设置"}`));

        const introMeta = el("div", "vp-project-meta");
        introMeta.appendChild(el("span", null, `版本 v${doc.revision}`));
        introMeta.appendChild(el("span", null, `创建 ${fmtDate(doc.createdAt)}`));
        introMeta.appendChild(el("span", null, `更新 ${fmtRelative(doc.updatedAt)}`));
        introMeta.appendChild(el("span", "vp-project-meta-spacer"));
        introMeta.appendChild(el("code", "vp-code", doc.id));
        const copyId = el("button", "vp-button", "复制 ID");
        copyId.addEventListener("click", () => copyText(doc.id, "作品 ID 已复制"));
        introMeta.appendChild(copyId);
        intro.appendChild(introMeta);
        section.appendChild(intro);
        section.appendChild(window.BoneProjectBible.render(doc, { copyText }));
        section.appendChild(renderAssetsCard(prod));
        bodyEl.replaceChildren(section);
      }

      // 资产：卡片形式 + 原项目的类型分类
      function renderAssetsCard(prod) {
        const doc = prod.snapshot.document;
        const assets = Array.isArray(doc.assets) ? doc.assets : [];
        const shots = shotsOf(doc);
        const card = el("div", "vp-card");

        const head = el("div", "vp-card-head");
        head.appendChild(el("h3", null, "资产"));
        const locked = assets.filter((asset) => asset.locked).length;
        head.appendChild(el("span", "vp-muted",
          assets.length ? `${assets.length} 项${locked ? ` · ${locked} 已锁定` : ""}` : ""));
        card.appendChild(head);
        const legacyCharacters = window.BoneAssetDetails.legacy(doc, copyText);
        if (legacyCharacters) card.appendChild(legacyCharacters);

        if (!assets.length) {
          card.appendChild(el("p", "vp-muted vp-card-note",
            "还没有资产；让 Agent 从剧本里提炼角色、场景与道具，镜头引用它们以保证一致性。"));
          return card;
        }

        // 搜索 + 分类
        const tools = el("div", "asset-tools");
        const search = el("label", "asset-search");
        search.appendChild(el("span", null, "🔍"));
        const input = document.createElement("input");
        input.type = "search";
        input.placeholder = "搜索资产名称或说明";
        input.value = assetSearch;
        input.addEventListener("input", () => {
          assetSearch = input.value;
          render();
          // 重新渲染后把焦点放回搜索框
          const again = document.querySelector(".asset-search input");
          if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        });
        search.appendChild(input);
        tools.appendChild(search);
        card.appendChild(tools);

        const counts = new Map();
        for (const asset of assets) counts.set(asset.type, (counts.get(asset.type) || 0) + 1);
        const filters = el("div", "asset-type-filters");
        for (const type of ["全部", ...ASSET_TYPES]) {
          const count = type === "全部" ? assets.length : counts.get(type) || 0;
          if (type !== "全部" && !count) continue; // 没有该类型就不占位
          const chip = el("button", "asset-type-filter", type);
          chip.setAttribute("aria-pressed", String(assetTypeFilter === type));
          chip.appendChild(el("span", null, String(count)));
          chip.addEventListener("click", () => {
            assetTypeFilter = type;
            render();
          });
          filters.appendChild(chip);
        }
        card.appendChild(filters);

        const keyword = assetSearch.trim().toLowerCase();
        const visible = assets.filter((asset) => {
          if (assetTypeFilter !== "全部" && asset.type !== assetTypeFilter) return false;
          if (!keyword) return true;
          return `${asset.name || ""} ${asset.description || ""} ${asset.profile || ""} ${asset.imagePrompt || ""} ${asset.negativePrompt || ""} ${asset.type || ""}`
            .toLowerCase().includes(keyword);
        });

        if (!visible.length) {
          card.appendChild(el("p", "vp-muted vp-card-note", "没有匹配的资产"));
          return card;
        }

        const grid = el("div", "asset-grid");
        for (const asset of visible) {
          const usedBy = shots.filter((shot) => (shot.assetIds || []).includes(asset.id)).length;
          const item = el("div", "asset-card");
          const open = el("button", "asset-card-open"); open.type = "button";
          open.setAttribute("aria-label", `查看${asset.name || asset.id}详情`);
          open.setAttribute("aria-haspopup", "dialog");
          const preview = el("div", "asset-card-preview");
          if (asset.mediaId && asset.type !== "声音") preview.appendChild(window.BoneMediaPreview.create({
            productionId: doc.id, mediaId: asset.mediaId, kind: "image",
            title: asset.name || "资产", zoom: false, load: args => bridge.invoke("bone.media", args),
          }));
          else preview.textContent = asset.type === "声音" ? "♫" : "📦";
          open.appendChild(preview);
          const info = el("div", "asset-card-info");
          info.appendChild(el("strong", null, asset.name || asset.id || "未命名"));
          const metaRow = el("div", "asset-card-meta");
          metaRow.appendChild(el("span", null, asset.type || "未分类"));
          metaRow.appendChild(el("span", null, usedBy ? `${usedBy} 镜引用` : "未使用"));
          info.appendChild(metaRow);
          if (asset.locked) info.appendChild(el("span", "vp-badge", "🔒 已锁定"));
          open.appendChild(info);
          item.appendChild(open);
          item.appendChild(window.BoneAssetDetails.render(asset, doc, copyText, open, () => window.BoneMediaPreview.create({
            productionId: doc.id, mediaId: asset.mediaId, kind: asset.type === "声音" ? "audio" : "image",
            title: asset.name || "资产", zoom: false, load: args => bridge.invoke("bone.media", args),
          })));
          grid.appendChild(item);
        }
        card.appendChild(grid);
        return card;
      }

      // 脚本页用到的常量；与函数分开维护，避免整段搬动时被误删
      const SCRIPT_ELEMENTS = [
        ["hook", "开场钩子"],
        ["turningPoint", "核心转折"],
        ["payoff", "阶段结果"],
        ["audiencePromise", "观众承诺"],
        ["productionNotes", "制作总要求"],
      ];
      const BEAT_PURPOSE_LABELS = {
        hook: "开场钩子",
        setup: "情境建立",
        "inciting-incident": "触发事件",
        "rising-action": "推进升级",
        reveal: "信息揭示",
        turn: "核心转折",
        resolution: "核心解折",
        tag: "余波",
      };
      // 剧本页：左菜单选集、右侧读剧本正文（一篇文章）
      function renderScriptTab(prod) {
        const doc = prod.snapshot.document;
        const shots = shotsOf(doc);
        const episodes = Array.isArray(doc.episodes) ? doc.episodes : [];
        if (!episodes.length) {
          const empty = el("div", "vp-empty");
          empty.appendChild(el("div", "vp-media", "📜"));
          empty.appendChild(el("strong", null, "还没有剧集"));
          empty.appendChild(el("p", null, "让 Agent 用「写剧本」或「整部剧本」先建立第一集。"));
          bodyEl.replaceChildren(empty);
          return;
        }
        if (!episodes.some((episode) => episode.id === scriptEpisodeId)) {
          scriptEpisodeId = episodes[0].id;
        }
        const split = el("div", "vp-ep-split");

        const menu = el("aside", "vp-ep-menu");
        for (const [index, episode] of episodes.entries()) {
          const item = el("button", "vp-ep-menu-item" + (episode.id === scriptEpisodeId ? " active" : ""));
          item.appendChild(el("span", "vp-ep-index", String(index + 1).padStart(2, "0")));
          item.appendChild(el("strong", null, episode.title || episode.id || "未命名集"));
          item.addEventListener("click", () => {
            scriptEpisodeId = episode.id;
            render();
          });
          menu.appendChild(item);
        }
        split.appendChild(menu);

        const selected = episodes.find((episode) => episode.id === scriptEpisodeId) || episodes[0];
        const script = selected.script && typeof selected.script === "object" ? selected.script : null;
        const prose = String(script?.prose || "").trim();
        const beats = Array.isArray(script?.beats) ? script.beats : [];
        const selectedShots = shots.filter((shot) => shot.episodeId === selected.id);
        const reader = el("div", "vp-ep-reader");

        const readerHead = el("div", "vp-ep-reader-head");
        const headCopy = el("div", "vp-ep-reader-copy");
        headCopy.appendChild(el("h4", null, selected.title || selected.id || "未命名集"));
        const headMeta = el("div", "vp-ep-reader-meta");
        headMeta.appendChild(el("span", null, `${selectedShots.length} 镜`));
        headMeta.appendChild(el("span", null, fmtDuration(
          selectedShots.reduce((sum, shot) => sum + (Number(shot.duration) || 0), 0))));
        const target = Number(script?.targetDurationSeconds) || 0;
        if (target) headMeta.appendChild(el("span", null, `目标 ${fmtDuration(target)}`));
        if (prose) headMeta.appendChild(el("span", null, `${prose.replace(/\s+/g, "").length} 字`));
        if (beats.length) headMeta.appendChild(el("span", null, `脚本 ${beats.length} 节拍`));
        headCopy.appendChild(headMeta);
        readerHead.appendChild(headCopy);
        const openBreakdown = el("button", "vp-button", "查看脚本");
        openBreakdown.addEventListener("click", () => {
          tab = "breakdown";
          scriptEpisodeId = selected.id;
          scriptBeatIndex = 0;
          render();
        });
        readerHead.appendChild(openBreakdown);
        reader.appendChild(readerHead);

        if (!prose) {
          reader.appendChild(el("p", "vp-ep-empty",
            beats.length
              ? "这一集还没有剧本正文（只有脚本节拍）。让 Agent 补写剧本：把故事写成一篇连续的文章。"
              : "这一集还没有剧本：让 Agent 写正文，再拆脚本节拍。"));
        } else {
          if (script.logline) reader.appendChild(el("p", "vp-ep-prose-lead", script.logline));
          const article = el("article", "vp-ep-prose");
          for (const paragraph of prose.split(/\n\s*\n/).map((part) => part.trim()).filter(Boolean)) {
            article.appendChild(el("p", null, paragraph));
          }
          reader.appendChild(article);
        }
        split.appendChild(reader);
        bodyEl.replaceChildren(split);
      }

      function renderBreakdownTab(prod) {
        const doc = prod.snapshot.document;
        const shots = shotsOf(doc);
        const episodes = Array.isArray(doc.episodes) ? doc.episodes : [];
        if (!episodes.length) {
          const empty = el("div", "vp-empty");
          empty.appendChild(el("div", "vp-media", "📜"));
          empty.appendChild(el("strong", null, "还没有剧集"));
          empty.appendChild(el("p", null, "让 Agent 用「写剧本」或「整部剧本」先建立第一集。"));
          bodyEl.replaceChildren(empty);
          return;
        }
        if (!episodes.some((episode) => episode.id === scriptEpisodeId)) {
          scriptEpisodeId = episodes[0].id;
          scriptBeatIndex = 0;
        }
        const ep = episodes.find((episode) => episode.id === scriptEpisodeId);
        const script = ep.script && typeof ep.script === "object" ? ep.script : {};
        const beats = Array.isArray(script.beats) ? script.beats : [];
        const epShots = shots.filter((shot) => shot.episodeId === ep.id);
        const shotById = new Map(epShots.map((shot) => [shot.id, shot]));
        const epSeconds = epShots.reduce((sum, shot) => sum + (Number(shot.duration) || 0), 0);
        const mappedShots = beats.reduce((sum, beat) => sum + (beat.shotIds || []).filter((id) => shotById.has(id)).length, 0);
        const elements = SCRIPT_ELEMENTS.filter(([key]) => script[key]);

        // ---- 工具条 ----
        const bar = el("div", "vp-script-bar");
        bar.appendChild(el("span", "vp-script-kicker", "SCREENPLAY"));
        const chooser = el("div", "vp-chiprow");
        for (const episode of episodes) {
          const chip = el("button", "vp-chip" + (episode.id === ep.id ? " active" : ""), episode.title || episode.id);
          chip.addEventListener("click", () => {
            scriptEpisodeId = episode.id;
            scriptBeatIndex = 0;
            render();
          });
          chooser.appendChild(chip);
        }
        bar.appendChild(chooser);

        const stats = el("div", "vp-script-stats");
        stats.appendChild(el("span", null, beats.length ? `${beats.length} 个节拍` : "无节拍"));
        stats.appendChild(el("span", null, `${mappedShots}/${epShots.length} 镜已映射`));
        const target = Number(script.targetDurationSeconds) || 0;
        stats.appendChild(el("span", null, target
          ? `${fmtDuration(epSeconds)} / 目标 ${fmtDuration(target)}`
          : fmtDuration(epSeconds)));
        bar.appendChild(stats);

        const actions = el("div", "vp-row-actions");
        const agentBtn = el("button", "vp-button", "复制给 Agent");
        agentBtn.addEventListener("click", () => copyText(
          buildAgentPrompt(doc, shots, shots.filter((shot) => shotState(prod.snapshot, shot.id)?.needsUpdate)),
          "指令已复制，去对话里粘贴",
        ));
        actions.appendChild(agentBtn);
        const shotsBtn = el("button", "vp-button", "去分镜");
        shotsBtn.addEventListener("click", () => { tab = "shots"; selectedShotId = epShots[0]?.id ?? null; render(); });
        actions.appendChild(shotsBtn);
        bar.appendChild(actions);

        const layout = el("div", "vp-script-layout");

        // ---- 左栏：节拍索引 ----
        const aside = el("aside", "vp-script-aside");
        const asideHead = el("div", "vp-script-aside-head");
        asideHead.appendChild(el("span", "vp-script-aside-title", "叙事节拍"));
        asideHead.appendChild(el("span", "vp-script-aside-count", String(beats.length)));
        aside.appendChild(asideHead);

        if (!beats.length) {
          aside.appendChild(el("p", "vp-script-aside-empty",
            elements.length ? "这一集只有整集要素，还没有拆成节拍。" : "这一集还没有剧本内容。"));
        }
        const beatEntries = beats.map((beat) => {
          const mapped = (beat.shotIds || []).filter((id) => shotById.has(id));
          const seconds = mapped.reduce((sum, id) => sum + (Number(shotById.get(id).duration) || 0), 0);
          return { beat, mapped, seconds };
        });
        beatEntries.forEach(({ beat, mapped, seconds }, index) => {
          const item = el("button", "vp-beat" + (index === scriptBeatIndex ? " active" : ""));
          item.appendChild(el("span", "vp-beat-index", String(index + 1).padStart(2, "0")));
          const copy = el("span", "vp-beat-copy");
          copy.appendChild(el("small", "vp-beat-purpose", BEAT_PURPOSE_LABELS[beat.purpose] || beat.purpose || "节拍"));
          copy.appendChild(el("strong", null, beat.title || "未命名节拍"));
          copy.appendChild(el("span", "vp-beat-meta",
            mapped.length ? `${mapped.length} 镜 · ${fmtDuration(seconds)}` : "尚未分镜"));
          item.appendChild(copy);
          item.addEventListener("click", () => { scriptBeatIndex = index; render(); });
          aside.appendChild(item);
        });
        layout.appendChild(aside);

        // ---- 右栏 ----
        const main = el("div", "vp-script-main");

        const arc = el("div", "vp-script-arc");
        const arcHead = el("button", "vp-script-arc-head");
        arcHead.appendChild(el("strong", null, "本集故事弧"));
        const chainText = [
          script.logline ? "一句话故事" : null,
          script.hook ? "开场钩子" : null,
          script.turningPoint ? "核心转折" : null,
          script.payoff ? "阶段结果" : null,
        ].filter(Boolean).join(" → ");
        arcHead.appendChild(el("span", "vp-script-arc-chain", chainText || "尚未填写"));
        arcHead.appendChild(el("span", "vp-script-arc-toggle", "展开全文"));
        const arcBody = el("div", "vp-script-arc-body");
        arcBody.hidden = true;
        for (const [key, label] of [["logline", "一句话故事"], ...SCRIPT_ELEMENTS]) {
          if (!script[key]) continue;
          const field = el("div", "vp-script-arc-field");
          field.appendChild(el("span", null, label));
          field.appendChild(el("p", null, String(script[key])));
          arcBody.appendChild(field);
        }
        arcHead.addEventListener("click", () => {
          arcBody.hidden = !arcBody.hidden;
          arcHead.querySelector(".vp-script-arc-toggle").textContent = arcBody.hidden ? "展开全文" : "收起";
        });
        arc.appendChild(arcHead);
        arc.appendChild(arcBody);
        main.appendChild(arc);

        const total = beats.length;
        // 只有整集要素、没有节拍的旧数据走下面的回退展示，不算"没有剧本"。
        if (!total && !elements.length) {
          const empty = el("div", "vp-empty");
          empty.appendChild(el("div", "vp-media", "📜"));
          empty.appendChild(el("strong", null, "这一集还没有剧本"));
          empty.appendChild(el("p", null, "让 Agent 为「" + (ep.title || ep.id) + "」写剧本：整集七要素 + 有序叙事节拍。"));
          main.appendChild(empty);
          layout.appendChild(main);
          const wrapEmpty = el("div", "vp-script-page");
          wrapEmpty.appendChild(bar);
          wrapEmpty.appendChild(layout);
          bodyEl.replaceChildren(wrapEmpty);
          return;
        }
        if (scriptBeatIndex >= total) scriptBeatIndex = 0;

        const detail = el("section", "vp-script-beat-detail");
        if (scriptBeatIndex < beats.length) {
          const { beat, mapped, seconds } = beatEntries[scriptBeatIndex];
          const head = el("div", "vp-script-beat-head");
          head.appendChild(el("span", "vp-script-beat-kicker", BEAT_PURPOSE_LABELS[beat.purpose] || "BEAT"));
          head.appendChild(el("span", "vp-script-beat-count", `${mapped.length} 个镜头`));
          detail.appendChild(head);
          detail.appendChild(el("h2", null, beat.title || "未命名节拍"));

          const grid = el("div", "vp-script-beat-grid");
          for (const [key, label] of [
            ["dramaticQuestion", "观众问题"],
            ["synopsis", "节拍概述"],
            ["visualAction", "视觉动作方向"],
            ["dialogue", "对白 / 旁白意图"],
            ["sound", "声音"],
            ["continuity", "连续性"],
          ]) {
            if (!beat[key]) continue;
            const field = el("div", "vp-script-beat-field");
            field.appendChild(el("span", null, label));
            field.appendChild(el("p", null, String(beat[key])));
            grid.appendChild(field);
          }
          if (grid.childElementCount) detail.appendChild(grid);

          const mappedBlock = el("div", "vp-script-mapped");
          const mappedHead = el("div", "vp-row");
          mappedHead.appendChild(el("strong", null, "映射分镜"));
          mappedHead.appendChild(el("span", "vp-muted", `${mapped.length} 个 · ${fmtDuration(seconds)}`));
          mappedBlock.appendChild(mappedHead);
          if (!mapped.length) {
            mappedBlock.appendChild(el("p", "vp-muted", "这个节拍还没有镜头。让 Agent 用「添加分镜」并带上该节拍 id 拆镜头。"));
          }
          for (const shotId of mapped) {
            const shot = shotById.get(shotId);
            const row = el("button", "vp-script-shot-row");
            row.appendChild(el("span", "vp-script-shot-index", String(epShots.indexOf(shot) + 1).padStart(2, "0")));
            const copy = el("span", "vp-script-shot-copy");
            copy.appendChild(el("strong", null, shot.title || shot.id));
            const state = shotState(prod.snapshot, shot.id);
            copy.appendChild(el("small", null, [
              shot.duration ? `${shot.duration}s` : null,
              state?.needsUpdate ? "待更新" : adoptedImageId(shot) ? "已采用" : "脚本就绪",
            ].filter(Boolean).join(" · ")));
            row.appendChild(copy);
            row.appendChild(el("span", "vp-script-shot-arrow", "→"));
            row.addEventListener("click", () => { tab = "shots"; selectedShotId = shot.id; render(); });
            mappedBlock.appendChild(row);
          }
          detail.appendChild(mappedBlock);
        } else {
          // 旧数据只有整集要素、没有节拍：作为只读回退显示，不放进左栏。
          const head = el("div", "vp-script-beat-head");
          head.appendChild(el("span", "vp-script-beat-kicker", "整集要素"));
          detail.appendChild(head);
          detail.appendChild(el("h2", null, ep.title || ep.id));
          const grid = el("div", "vp-script-beat-grid");
          for (const [key, label] of [["logline", "一句话故事"], ...SCRIPT_ELEMENTS]) {
            if (!script[key]) continue;
            const field = el("div", "vp-script-beat-field");
            field.appendChild(el("span", null, label));
            field.appendChild(el("p", null, String(script[key])));
            grid.appendChild(field);
          }
          if (grid.childElementCount) detail.appendChild(grid);
          detail.appendChild(el("p", "vp-muted",
            "这一集还没有拆成叙事节拍；让 Agent 用「整部剧本」补写 beats，左栏就会出现节拍索引。"));
        }

        // 节拍之外还有镜头时提示，避免它们看起来丢了
        const mappedIds = new Set(beats.flatMap((beat) => beat.shotIds || []));
        const unmapped = epShots.filter((shot) => !mappedIds.has(shot.id));
        if (unmapped.length) {
          const note = el("div", "vp-script-unmapped");
          const noteHead = el("div", "vp-script-unmapped-head");
          noteHead.appendChild(el("span", null, `${unmapped.length} 个镜头尚未映射到节拍`));
          const mapBtn = el("button", "vp-button", "让 Agent 补映射");
          mapBtn.addEventListener("click", () => {
            const lines = [
              `请把 Bone 影视工厂作品 ${doc.id}《${doc.title}》第「${ep.title || ep.id}」集里这 ${unmapped.length} 个镜头映射到对应的叙事节拍：`,
              ...unmapped.map((shot) => `• ${shot.title || shot.id}（${shot.duration || 0}s）${shot.scene ? "：" + String(shot.scene).slice(0, 40) : ""}`),
              "当前节拍：" + (beats.map((beat, i) => `${i + 1}. ${beat.title}`).join("；") || "（无）"),
              "请用 update_shot 带 beatId 逐个挂到最合适的节拍；若都不合适，先用 write_episodes 补一个节拍（注意 beats 是整体替换，要把其余节拍一并带上）。",
            ];
            copyText(lines.join("\n"), "指令已复制，去对话里粘贴");
          });
          noteHead.appendChild(mapBtn);
          note.appendChild(noteHead);
          for (const shot of unmapped) {
            const row = el("button", "vp-script-shot-row");
            row.appendChild(el("span", "vp-script-shot-index", String(epShots.indexOf(shot) + 1).padStart(2, "0")));
            const copy = el("span", "vp-script-shot-copy");
            copy.appendChild(el("strong", null, shot.title || shot.id));
            copy.appendChild(el("small", null, shot.duration ? `${shot.duration}s` : "静帧"));
            row.appendChild(copy);
            row.appendChild(el("span", "vp-script-shot-arrow", "→"));
            row.addEventListener("click", () => { tab = "shots"; selectedShotId = shot.id; render(); });
            note.appendChild(row);
          }
          detail.appendChild(note);
        }

        main.appendChild(detail);
        layout.appendChild(main);
        const wrap = el("div", "vp-script-page");
        wrap.appendChild(bar);
        wrap.appendChild(layout);
        bodyEl.replaceChildren(wrap);
      }

      function renderShotsTab(prod) {
        const context = window.BoneStoryboard.selection(prod.snapshot.document, scriptEpisodeId, selectedShotId);
        scriptEpisodeId = context.group?.id ?? null;
        selectedShotId = context.shot?.id ?? null;
        const page = window.BoneStoryboard.render(prod.snapshot, context, {
          editorial: prod.workflow?.editorial,
          loadMedia: args => bridge.invoke("bone.media", args),
          preview: (media, options = {}) => window.BoneMediaPreview.create({
            productionId: prod.snapshot.document.id, mediaId: media.id, kind: media.kind,
            title: options.title || "镜头素材", zoom: Boolean(options.zoom), load: args => bridge.invoke("bone.media", args),
          }),
          onEpisode: (id) => {
            scriptEpisodeId = id;
            scriptBeatIndex = 0;
            selectedShotId = null;
            render();
            document.querySelector(".bw-episode-picker summary")?.focus();
          },
          onShot: (id) => {
            selectedShotId = id;
            render();
            const card = document.querySelector('.bw-shot[aria-pressed="true"]');
            card?.focus({ preventScroll: true });
            card?.scrollIntoView({ block: "nearest", inline: "nearest" });
          },
          onCopy: (text) => copyText(text, "已复制，粘贴到对话交给 Agent"),
          onBeat: (id) => {
            scriptBeatIndex = Math.max(0, (context.group?.episode?.script?.beats || []).findIndex(beat => beat.id === id));
            tab = "breakdown";
            render();
          },
          onAsset: (asset) => {
            if (!asset) return;
            assetTypeFilter = "全部";
            assetSearch = asset.name || asset.id;
            tab = "project";
            render();
            document.querySelector(".asset-search input")?.focus();
            document.querySelector(".asset-grid")?.scrollIntoView({ block: "nearest" });
          },
        });
        bodyEl.replaceChildren(page);
      }

      function renderConfigurationTab(prod) {
        const snapshot = prod.snapshot;
        const section = el("div", "vp-section");
        if (prod.workflow) {
          const flow = prod.workflow;
          const card = el("section", "vp-card");
          card.setAttribute("aria-label", "Agent 创作流程");
          card.appendChild(el("h3", null, "Agent 创作流程"));
          card.appendChild(el("p", "vp-muted", flow.complete ? "已登记的创作链完整，请继续观看检查成片质量。" : flow.next?.message || "先读取作品，检查下一步。"));
          const issues = (flow.issues || []).slice(0, 5);
          if (issues.length) {
            const list = el("ul", "vp-workflow-issues");
            for (const issue of issues) list.appendChild(el("li", null, issue.message));
            card.appendChild(list);
          }
          if (flow.readiness) {
            const state = flow.readiness;
            const summary = el("div", "bw-editorial-metrics");
            for (const [label, value] of [
              ["正文已保存", `${state.text.savedEpisodes}/${state.text.totalEpisodes} 集`],
              ["制作计划", `${state.planning.plannedShots}/${state.planning.totalShots} 镜`],
              ["主输出已采用", `${state.media.adoptedPrimary}/${state.media.totalShots} 镜`],
              ["当前有效剪辑", `${state.editing.currentEpisodes}/${state.editing.savedEpisodes} 集`],
              ["需复核的审核", `${state.review.stale} 项`],
              ["当前审核结论", `${state.review.supported} 支持 · ${state.review.needsRevision} 修改 · ${state.review.notVerified} 未验证`],
            ]) {
              const item = el("div", "bw-editorial-field"); item.append(el("span", "vp-muted", label), el("p", null, value)); summary.append(item);
            }
            card.append(summary, el("p", "bw-note", "审核是带证据的评审记录；保存、采用与结构完整均不等于艺术质量或最终交付通过。"));
          }
          for (const warning of flow.timingWarnings || []) card.appendChild(el("p", "bw-editorial-warning", warning.message));
          const next = el("button", "vp-button", "复制下一步给 Agent");
          next.addEventListener("click", () => copyText(
            `继续 Bone 影视工厂作品 ${snapshot.document.id}《${snapshot.document.title}》。先读取 get_production 和 get_workflow_status，处理最早的相关缺口。${flow.next?.message || "核查已完成结果。"} 真实素材必须 register_media 后 adopt_media；保留其他已定稿内容。`,
            "已复制下一步指令",
          ));
          card.appendChild(next);
          section.appendChild(card);
        }
        section.appendChild(window.BoneRevisions.render(snapshot, prod.workflow?.revisions, copyText));

         const doc = snapshot.document;
         const shots = shotsOf(doc);
         const assets = Array.isArray(doc.assets) ? doc.assets : [];
         const episodes = Array.isArray(doc.episodes) ? doc.episodes : [];
         const totalSeconds = shots.reduce((sum, shot) => sum + (Number(shot.duration) || 0), 0);

         // 概览：一行可读的制作体量
         const overview = el("div", "vp-card");
         overview.appendChild(el("h3", null, "制作概览"));
         const stats = el("div", "vp-stat-grid");
         const statCells = [
           ["集数", episodes.length],
           ["镜头", shots.length],
           ["资产", assets.length],
           ["成片预算", fmtDuration(totalSeconds)],
         ];
         for (const [label, value] of statCells) {
           const cell = el("div", "vp-stat");
           cell.appendChild(el("strong", null, String(value)));
           cell.appendChild(el("span", null, label));
           stats.appendChild(cell);
         }
         overview.appendChild(stats);
         section.appendChild(overview);

         // 每集时长拆解
         if (episodes.length) {
           const byEpisode = el("div", "vp-card");
           byEpisode.appendChild(el("h3", null, "分集体量"));
           for (const [index, ep] of episodes.entries()) {
             const epShots = shots.filter((shot) => shot.episodeId === ep.id);
             const epSeconds = epShots.reduce((sum, shot) => sum + (Number(shot.duration) || 0), 0);
             const row = el("div", "vp-line");
             row.appendChild(el("span", "vp-line-index", String(index + 1).padStart(2, "0")));
             const name = el("span", "vp-line-name", ep.title || ep.id);
             row.appendChild(name);
             row.appendChild(el("span", "vp-muted", `${epShots.length} 镜 · ${fmtDuration(epSeconds)}`));
             if (ep.script?.targetDurationSeconds) {
               const gap = ep.script.targetDurationSeconds - epSeconds;
               const tone = Math.abs(gap) <= 3 ? "ready" : "review";
               row.appendChild(el("span", `vp-badge ${tone}`, `目标 ${fmtDuration(ep.script.targetDurationSeconds)}`));
             }
             byEpisode.appendChild(row);
           }
           const orphan = shots.filter((shot) => !episodes.some((ep) => ep.id === shot.episodeId));
           if (orphan.length) {
             const row = el("div", "vp-line");
             row.appendChild(el("span", "vp-line-index", "—"));
             row.appendChild(el("span", "vp-line-name", "未归属集"));
             row.appendChild(el("span", "vp-muted", `${orphan.length} 镜 · ${fmtDuration(orphan.reduce((s, x) => s + (Number(x.duration) || 0), 0))}`));
             byEpisode.appendChild(row);
           }
           section.appendChild(byEpisode);
         }

         // 待更新清单：点击直接跳到该镜头
         const stale = shots.filter((shot) => shotState(snapshot, shot.id)?.needsUpdate);
         const staleCard = el("div", "vp-card");
         staleCard.appendChild(el("h3", null, `待更新镜头（${stale.length}）`));
         if (!stale.length) {
           staleCard.appendChild(el("p", "vp-muted", "所有镜头设定都已定稿。"));
         } else {
           for (const shot of stale) {
             const row = el("button", "vp-line vp-line-button");
             row.appendChild(el("span", "vp-line-index", String(shots.indexOf(shot) + 1).padStart(2, "0")));
             row.appendChild(el("span", "vp-line-name", shot.title || shot.id));
             row.appendChild(el("span", "vp-badge review", "待更新"));
             row.addEventListener("click", () => {
               tab = "shots";
               selectedShotId = shot.id;
               render();
             });
             staleCard.appendChild(row);
           }
         }
         section.appendChild(staleCard);

         // 资产引用图：谁是死资产一眼可见
         if (assets.length) {
           const refCard = el("div", "vp-card");
           refCard.appendChild(el("h3", null, "资产引用"));
           for (const asset of assets) {
             const used = shots.filter((shot) => (shot.assetIds || []).includes(asset.id)).length;
             const row = el("div", "vp-line");
             row.appendChild(el("span", used ? "vp-line-index" : "vp-line-index vp-line-index-quiet", String(used)));
             row.appendChild(el("span", "vp-line-name", asset.name || asset.id));
             row.appendChild(el("span", "vp-muted", asset.type || "未分类"));
             if (asset.locked) row.appendChild(el("span", "vp-badge", "🔒"));
             if (!used) row.appendChild(el("span", "vp-badge review", "未使用"));
             refCard.appendChild(row);
           }
           section.appendChild(refCard);
         }

         // 交给 Agent：把作品 id 和一段可直接粘贴的指令复制走
         const handoff = el("div", "vp-card");
         handoff.appendChild(el("h3", null, "交给 Agent"));
         handoff.appendChild(el("p", "vp-muted", "在对话里粘贴下面的 ID 或整段指令，让 Agent 继续完善这个作品。"));
         const idLine = el("div", "vp-line");
         idLine.appendChild(el("span", "vp-line-name", "作品 ID"));
         idLine.appendChild(el("code", "vp-code", doc.id));
         const copyId = el("button", "vp-button", "复制");
         copyId.addEventListener("click", () => copyText(doc.id, "作品 ID 已复制"));
         idLine.appendChild(copyId);
         handoff.appendChild(idLine);
         const prompt = buildAgentPrompt(doc, shots, stale);
         const promptBox = el("div", "vp-prompt");
         promptBox.textContent = prompt;
         handoff.appendChild(promptBox);
         const copyPrompt = el("button", "vp-button primary", "复制指令");
         copyPrompt.addEventListener("click", () => copyText(prompt, "指令已复制，去对话里粘贴"));
         handoff.appendChild(copyPrompt);
         section.appendChild(handoff);

        const jobs = Array.isArray(snapshot.jobs) ? snapshot.jobs : [];
        const jobsCard = el("div", "vp-card");
        jobsCard.appendChild(el("h3", null, `制作任务（${jobs.length}）`));
        if (!jobs.length) {
          jobsCard.appendChild(el("p", "vp-muted", "暂无生成任务记录。"));
        } else {
          const list = el("div", "vp-section");
          const shots = shotsOf(snapshot.document || {});
          for (const job of jobs.slice(-8).reverse()) {
            const record = el("div", "vp-record");
            const head = el("div", "vp-record-heading");
            head.appendChild(el("h3", null, job.id || "任务"));
            head.appendChild(el("span", "vp-badge", JOB_STATUS_LABELS[job.status] || job.status || "未知"));
            record.appendChild(head);
            const shot = shots.find((item) => item.id === job.shotId);
            const meta = el("div", "vp-record-meta");
            meta.appendChild(el("span", null, shot ? `镜头 ${shot.title || shot.id}` : job.shotId ? `镜头 ${job.shotId}` : "作品级任务"));
            if (job.createdAt) meta.appendChild(el("time", null, fmtTime(job.createdAt)));
            record.appendChild(meta);
            list.appendChild(record);
          }
          jobsCard.appendChild(list);
        }
        section.appendChild(jobsCard);
        bodyEl.replaceChildren(section);
      }

      // ---------- wiring ----------
      dirToggle.addEventListener("click", () => { directoryOpen = !directoryOpen; render(); });
       // ---------- 新建 / 编辑作品弹窗 ----------
       const createDialog = document.getElementById("createDialog");
       const createForm = document.getElementById("createForm");
       const createError = document.getElementById("createError");
       const createSubmit = document.getElementById("createSubmit");
       const dialogTitle = document.getElementById("dialogTitle");
       const dialogHint = document.getElementById("dialogHint");
       let editingId = null; // null = 新建；否则是正在编辑的作品 id

       // ---------- 自定义下拉（替代系统原生 select） ----------
       const selectWraps = [...createForm.querySelectorAll(".vp-select")];

       function setSelectValue(name, value) {
         const wrap = selectWraps.find((node) => node.dataset.name === name);
         if (!wrap) return;
         const options = [...wrap.querySelectorAll("[role=option]")];
         const match = options.find((option) => option.dataset.value === value) || options[0];
         wrap.dataset.value = match.dataset.value;
         wrap.querySelector(".vp-select-value").textContent = match.textContent;
         for (const option of options) {
           option.setAttribute("aria-selected", String(option === match));
         }
       }
       function getSelectValue(name) {
         return selectWraps.find((node) => node.dataset.name === name)?.dataset.value ?? "";
       }
       function closeAllSelects() {
         for (const wrap of selectWraps) {
           wrap.querySelector(".vp-select-menu").hidden = true;
           wrap.querySelector(".vp-select-trigger").setAttribute("aria-expanded", "false");
         }
       }
       for (const wrap of selectWraps) {
         const trigger = wrap.querySelector(".vp-select-trigger");
         const menu = wrap.querySelector(".vp-select-menu");
         trigger.addEventListener("click", (event) => {
           event.stopPropagation();
           const wasHidden = menu.hidden;
           closeAllSelects();
           menu.hidden = !wasHidden;
           trigger.setAttribute("aria-expanded", String(!menu.hidden));
         });
         for (const option of wrap.querySelectorAll("[role=option]")) {
           option.addEventListener("click", () => {
             setSelectValue(wrap.dataset.name, option.dataset.value);
             closeAllSelects();
             trigger.focus();
           });
         }
       }
       document.addEventListener("click", () => closeAllSelects());
       document.addEventListener("keydown", (event) => {
         if (event.key === "Escape") closeAllSelects();
       });

       function resetDialogFields() {
         createForm.reset();
         setSelectValue("kind", "comic");
         setSelectValue("ratio", "16:9");
         closeAllSelects();
       }

       function openCreateDialog() {
         editingId = null;
         dialogTitle.textContent = "新建影像作品";
         dialogHint.textContent = "确认后立即创建；剧本、资产与分镜随后由 Agent 逐步写入。";
         createSubmit.textContent = "创建作品";
         createError.hidden = true;
         resetDialogFields();
         createDialog.showModal();
         createForm.elements.title.focus();
       }

       // 编辑复用同一个表单，字段与 create_production / update_production 一致。
       function openEditDialog(doc) {
         editingId = doc.id;
         dialogTitle.textContent = "编辑作品设定";
         dialogHint.textContent = `修改《${doc.title}》的设定字段；只改这里填的内容，剧本与分镜不受影响。`;
         createSubmit.textContent = "保存修改";
         createError.hidden = true;
         resetDialogFields();
         const fields = createForm.elements;
         fields.title.value = doc.title || "";
         setSelectValue("kind", doc.kind || "comic");
         setSelectValue("ratio", doc.ratio || "16:9");
         fields.style.value = doc.style || "";
         fields.fps.value = String(doc.fps ?? 24);
         fields.brief.value = doc.brief || "";
         fields.arc.value = doc.arc || "";
         fields.voice.value = doc.voice || "";
         fields.music.value = doc.music || "";
         createDialog.showModal();
         fields.title.focus();
       }

       createForm.addEventListener("submit", async (event) => {
         event.preventDefault();
         const data = Object.fromEntries(new FormData(createForm).entries());
         const payload = {
           title: String(data.title || "").trim(),
           kind: getSelectValue("kind") || "comic",
           ratio: getSelectValue("ratio") || "16:9",
           fps: Number(data.fps),
           style: String(data.style || "").trim(),
           brief: String(data.brief || "").trim(),
           arc: String(data.arc || "").trim(),
           voice: String(data.voice || "").trim(),
           music: String(data.music || "").trim(),
         };
         if (!payload.title) {
           createError.textContent = "标题不能为空。";
           createError.hidden = false;
           createForm.elements.title.focus();
           return;
         }
         createSubmit.disabled = true;
         createError.hidden = true;
         try {
           if (editingId) {
             await bridge.invoke("bone.update", { id: editingId, ...payload });
             createDialog.close();
             current = null; // 重新拉取，避免用旧快照渲染
             await loadList();
             flash("设定已保存");
           } else {
             const created = await bridge.invoke("bone.create", payload);
             createDialog.close();
             currentId = created.id;
             current = null;
             tab = "project";
             selectedShotId = null;
             await loadList();
             flash(`已创建《${payload.title}》`);
           }
         } catch (error) {
           const action = editingId ? "保存" : "创建";
           createError.textContent = `${action}失败：${String(error && error.message || error)}`;
           createError.hidden = false;
         } finally {
           createSubmit.disabled = false;
         }
       });

       document.getElementById("createCancel").addEventListener("click", () => createDialog.close());
      refreshBtn.addEventListener("click", () => {
        void refreshCapabilities();
        loadList();
      });
      refreshEmpty.addEventListener("click", () => openCreateDialog());

      // ---------- 删除确认 ----------
      const confirmDialog = document.getElementById("confirmDialog");
      const confirmTitle = document.getElementById("confirmTitle");
      const confirmHint = document.getElementById("confirmHint");
      const confirmDetail = document.getElementById("confirmDetail");
      const confirmOk = document.getElementById("confirmOk");
      let pendingDelete = null;

      function askDeleteProduction(summary) {
        pendingDelete = summary;
        confirmTitle.textContent = "删除作品";
        confirmHint.textContent = `《${summary.title || summary.id}》`;
        confirmDetail.textContent =
          `将永久删除该作品的剧本、${summary.assetCount ?? 0} 个资产与 ${summary.shotCount ?? 0} 个镜头，无法恢复。`;
        confirmOk.disabled = false;
        confirmDialog.showModal();
      }

      document.getElementById("confirmCancel").addEventListener("click", () => {
        pendingDelete = null;
        confirmDialog.close();
      });

      confirmOk.addEventListener("click", async () => {
        if (!pendingDelete) return;
        const target = pendingDelete;
        confirmOk.disabled = true;
        try {
          await bridge.invoke("bone.delete", { id: target.id, confirm: true });
          confirmDialog.close();
          pendingDelete = null;
          if (currentId === target.id) {
            currentId = null;
            current = null;
            selectedShotId = null;
          }
          await loadList();
          flash(`已删除《${target.title || target.id}》`);
        } catch (error) {
          confirmDetail.textContent = `删除失败：${String(error && error.message || error)}`;
          confirmOk.disabled = false;
        }
      });
      // 面板重新获得焦点时轻量核对一次版本：插件热重载后不必手动重开面板。
      window.addEventListener("focus", async () => {
        try {
          const status = await bridge.invoke("bone.status");
          const version = status?.version ? String(status.version) : "";
          const build = document.querySelector('meta[name="bone-build"]')?.content || "";
          if (selfHealToVersion(version, build)) return;
          const versionEl = document.getElementById("topVersion");
          if (versionEl && version) {
            versionEl.hidden = false;
            versionEl.textContent = "v" + version;
          }
        } catch {
          // 宿主不支持 bone.status 时忽略。
        }
      });

      void refreshCapabilities();
      loadList();
    </script>
  </body>
</html>
